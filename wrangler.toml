name = "mideast-tracker-worker"
main = "worker/index.js"
compatibility_date = "2024-01-01"

# This Worker is deployed alongside the Pages site.
# It handles all requests to /api/* routes.
#
# To bind it to your Pages project, go to:
#   Cloudflare Dashboard → Pages → mideast-tracker → Settings → Functions
#   and add a "Functions" binding, or deploy the worker separately
#   and set the route to: mideast-tracker.pages.dev/api/*

[vars]
# Non-secret vars go here. Keep secrets in Cloudflare dashboard
# or set via: wrangler secret put ANTHROPIC_API_KEY

# Uncomment to restrict to your Pages domain once deployed:
# ALLOWED_ORIGIN = "https://mideast-tracker.pages.dev"
